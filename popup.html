<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>抖音智能选品</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<div class="header-container">
			<div style="display: flex;align-items: center;">
				<h3 style="margin: 0;">抖音智能选品</h3>
				<span style="margin-left: 10px;">软件版本：<text id="version_name"></text></span>
			</div>
		</div>

		<div class="modal-content" style="min-height: 500px;">
			<div class="record-header">
				<h4>使用说明</h4>
			</div>

			<div style="padding: 12px; line-height: 1.6; color: #111827;">
				<div>1) 在百应商品页点击：<b>下载图片</b>（用于写入商品信息并下载图片素材）</div>
				<div>2) 在抖音搜索页/视频详情页点击：<b>下载1/下载2/下载3</b>（下载视频素材）</div>
				<div style="margin-top: 8px; color: #6B7280; font-size: 12px;">
					说明：当前版本仅保留本地下载能力，已移除对外部业务服务器的依赖。
				</div>
			</div>

			<div class="record-header" style="margin-top: 8px;">
				<h4>当前商品上下文</h4>
				<button id="clear-project-btn" class="btn-default btn-sm">清除</button>
			</div>

			<div style="padding: 12px;">
				<div id="project-info" style="color: #111827;"></div>
			</div>
		</div>

		<script src="popup.js"></script>

	</body>
</html>
