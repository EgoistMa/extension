<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百应选品助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 600px;
      max-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      background: #f5f5f5;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 500;
    }

    .header .count {
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
    }

    .toolbar {
      background: white;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid #eee;
    }

    .toolbar-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .toolbar-row:first-child {
      margin-bottom: 8px;
    }

    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5a6fd6;
    }

    .btn-secondary {
      background: #e8e8e8;
      color: #333;
    }

    .btn-secondary:hover {
      background: #ddd;
    }

    .btn-success {
      background: #52c41a;
      color: white;
    }

    .btn-success:hover {
      background: #45a817;
    }

    .content {
      max-height: 380px;
      overflow-y: auto;
      background: white;
    }

    .product-table {
      width: 100%;
      border-collapse: collapse;
    }

    .product-table th {
      background: #fafafa;
      padding: 10px 12px;
      text-align: left;
      font-weight: 500;
      color: #666;
      position: sticky;
      top: 0;
      border-bottom: 1px solid #eee;
    }

    .product-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: top;
    }

    .product-table tr:hover {
      background: #f9f9ff;
    }

    .product-name {
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #333;
    }

    .commission-rate {
      color: #ff4d4f;
      font-weight: 600;
    }

    .commission-amount {
      color: #52c41a;
      font-weight: 600;
    }

    .price {
      color: #666;
    }

    .sales {
      color: #1890ff;
      font-weight: 500;
    }

    .score {
      color: #faad14;
      font-weight: 500;
    }

    .total-score {
      color: #722ed1;
      font-weight: 700;
    }

    .btn-recommend {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-recommend:hover {
      opacity: 0.9;
    }

    .smart-panel {
      background: white;
      border-bottom: 1px solid #eee;
      padding: 12px 16px;
    }

    .smart-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 500;
      color: #333;
    }

    .btn-close {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #999;
    }

    .btn-close:hover {
      color: #333;
    }

    .smart-panel-body {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .weight-group {
      flex: 1;
      min-width: 150px;
    }

    .weight-group label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .weight-group input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    .top-count-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-count-group label {
      font-size: 12px;
      color: #666;
    }

    .top-count-group select {
      padding: 4px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: #999;
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .loading {
      padding: 40px;
      text-align: center;
      color: #666;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .toast.show {
      opacity: 1;
    }

    .search-box {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }

    .search-box:focus {
      outline: none;
      border-color: #667eea;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>百应选品助手</h1>
    <span class="count" id="productCount">0 个产品</span>
  </div>

  <div class="toolbar">
    <div class="toolbar-row">
      <input type="text" class="search-box" id="searchBox" placeholder="搜索产品名称...">
      <button class="btn btn-primary" id="refreshBtn">刷新</button>
    </div>
    <div class="toolbar-row">
      <button class="btn btn-recommend" id="smartBtn">🎯 智能推荐</button>
      <button class="btn btn-success" id="copyBtn">📋 复制</button>
      <button class="btn btn-secondary" id="exportBtn">📥 导出</button>
    </div>
  </div>

  <div class="smart-panel" id="smartPanel" style="display: none;">
    <div class="smart-panel-header">
      <span>🎯 智能选品设置</span>
      <button class="btn-close" id="closePanelBtn">×</button>
    </div>
    <div class="smart-panel-body">
      <div class="weight-group">
        <label>佣金权重: <span id="commissionVal">40%</span></label>
        <input type="range" id="commissionWeight" min="0" max="100" value="40">
      </div>
      <div class="weight-group">
        <label>销量权重: <span id="salesVal">35%</span></label>
        <input type="range" id="salesWeight" min="0" max="100" value="35">
      </div>
      <div class="weight-group">
        <label>评分权重: <span id="scoreVal">25%</span></label>
        <input type="range" id="scoreWeight" min="0" max="100" value="25">
      </div>
      <div class="top-count-group">
        <label>推荐数量:</label>
        <select id="topCount">
          <option value="5">Top 5</option>
          <option value="10" selected>Top 10</option>
          <option value="20">Top 20</option>
          <option value="0">全部排序</option>
        </select>
      </div>
      <button class="btn btn-recommend" id="applySmartBtn" style="width: 100%; margin-top: 10px;">应用推荐</button>
    </div>
  </div>

  <div class="content" id="content">
    <div class="loading">正在加载产品数据...</div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
